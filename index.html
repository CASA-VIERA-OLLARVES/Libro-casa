<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f3864">
<title>Casa Viera Ollarves · Ingresos y egresos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%92%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa V.O.">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#f3f5fa; --card:#ffffff; --ink:#1b2333; --muted:#6b7488; --line:#e5e9f1;
  --brand:#1f3864; --accent:#2f5597; --soft:#e4edf9; --chip:#eef2fa;
  --pos:#00703c; --neg:#c00000; --inc:#2f5597; --exp:#d9822b;
  --field:#ffffff; --danger:#c00000; --shadow:0 1px 2px rgba(20,30,60,.06),0 6px 18px rgba(20,30,60,.05);
  --gold:#FFCC00; --gold-ink:#5c4500; --ve-blue:#00247D; --ve-red:#CF142B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1420; --card:#171e2d; --ink:#e7ecf6; --muted:#93a0b8; --line:#26304a;
    --brand:#a9c3ff; --accent:#6d97ee; --soft:#1e2a44; --chip:#212b42;
    --pos:#4ade80; --neg:#ff8080; --inc:#6d97ee; --exp:#f0a35c; --field:#111828; --danger:#ff8080;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1420; --card:#171e2d; --ink:#e7ecf6; --muted:#93a0b8; --line:#26304a;
  --brand:#a9c3ff; --accent:#6d97ee; --soft:#1e2a44; --chip:#212b42;
  --pos:#4ade80; --neg:#ff8080; --inc:#6d97ee; --exp:#f0a35c; --field:#111828; --danger:#ff8080;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-text-size-adjust:100%; min-height:100%;
}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
.flagbar{height:5px;background:linear-gradient(90deg,var(--gold) 0 33.33%,var(--ve-blue) 33.33% 66.66%,var(--ve-red) 66.66% 100%);}

.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px 0;
}
.top-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; max-width:1240px; margin:0 auto}
.brand h1{font-size:19px; color:var(--brand); letter-spacing:-.01em}
.brand p{font-size:12px; color:var(--muted)}
.controls{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
select,.btn{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:8px 12px; font:inherit}
select{font-weight:600; max-width:190px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
.btn.danger{color:var(--danger); border-color:var(--danger); background:transparent}
.btn.danger.solid{background:var(--danger); color:#fff}
.btn[disabled]{opacity:.6; cursor:default}
.pill{font-size:12px; color:var(--muted); padding:4px 10px; border-radius:99px; background:var(--chip); white-space:nowrap}
.pill.err{color:var(--neg); font-weight:600}
.tabs{display:flex; gap:4px; max-width:1240px; margin:10px auto 0}
.tab{border:0; background:transparent; padding:9px 16px; border-radius:10px 10px 0 0; color:var(--muted); font-weight:600; border-bottom:3px solid transparent; white-space:nowrap}
.tab[aria-selected="true"]{color:var(--brand); border-bottom-color:var(--accent)}

main{max-width:1240px; margin:0 auto; padding:16px 16px 48px}
.center{max-width:420px; margin:56px auto; padding:0 16px}
#loading{text-align:center; color:var(--muted)}
#loading .err{color:var(--neg); margin-top:12px}

.loginbox{background:var(--card); border-radius:16px; padding:24px; box-shadow:var(--shadow); display:grid; gap:12px}
.loginbox h2{font-size:18px; color:var(--brand)}
.loginbox label{display:grid; gap:4px; font-size:12px; color:var(--muted)}
.loginbox input,.modal input.txt,.modal input[type="month"]{
  border:1px solid var(--line); background:var(--field); color:var(--ink); border-radius:8px; padding:10px; font:inherit; width:100%;
}
.loginbox input:focus{outline:2px solid var(--accent); outline-offset:-1px}
.err{color:var(--neg); font-size:13px; min-height:1.2em}
.link{background:none; border:0; color:var(--accent); padding:0; text-align:left; font-size:13px}
.setup{background:var(--card); border-radius:16px; padding:24px; box-shadow:var(--shadow)}
.setup code{background:var(--chip); padding:1px 6px; border-radius:6px}

.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:16px}
.kpi{background:var(--card); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow)}
.kpi span{display:block; font-size:12px; color:var(--muted); margin-bottom:4px}
.kpi b{font-size:22px; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.kpi.soft{background:var(--soft)}
.pos{color:var(--pos)} .neg{color:var(--neg)}

.qgrid{
  display:grid; gap:16px; align-items:start;
  grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);
  grid-template-areas:"ing egr" "pla egr" "ant egr";
}
.qgrid > .card[data-sec="ingresos"]{grid-area:ing}
.qgrid > .card[data-sec="plataformas"]{grid-area:pla}
.qgrid > .card[data-sec="egresos"]{grid-area:egr}
.qgrid > .card[data-sec="anticipados"]{grid-area:ant}
.card{background:var(--card); border-radius:14px; padding:14px 14px 12px; box-shadow:var(--shadow); min-width:0}
.card > header{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:2px; padding:0 4px}
.card h2{font-size:14px; letter-spacing:.04em; text-transform:uppercase; color:var(--brand)}
.card .tot{font-size:16px; font-weight:700; font-variant-numeric:tabular-nums}
.hint{font-size:12px; color:var(--muted); padding:0 4px 8px}
.hint b{color:var(--ink)}

.head,.row{display:grid; gap:6px; align-items:center}
.head{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#fff; background:var(--accent); border-radius:8px; padding:6px 8px; margin-top:6px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .head{color:#0f1420}}
:root[data-theme="dark"] .head{color:#0f1420}
.head span:nth-child(n+2){text-align:right}
.row{padding:2px 4px; border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.r2{grid-template-columns:minmax(0,1fr) 128px 26px}
.r3{grid-template-columns:minmax(0,1fr) 146px 100px 34px 26px}
.r5{grid-template-columns:minmax(0,1fr) 104px 54px 92px 40px 26px}
.head.r5 span:nth-child(3),.head.r5 span:nth-child(5){text-align:center}
.head.r3 span:nth-child(2){text-align:left}
.head.r3 span:nth-child(4){text-align:center; font-size:10.5px}

input[type="text"]{width:100%; min-width:0; border:1px solid transparent; background:transparent; color:inherit; font:inherit; padding:7px 8px; border-radius:8px}
input[type="text"]:hover{background:var(--field); border-color:var(--line)}
input[type="text"]:focus{outline:2px solid var(--accent); outline-offset:-1px; background:var(--field)}
input.num{text-align:right; font-variant-numeric:tabular-nums}
input.mid{text-align:center}
.r3 select,.rpick select{width:100%; min-width:0; border:1px solid var(--line); background:var(--field); color:inherit; font:inherit; font-size:12.5px; padding:6px 6px; border-radius:8px}
.r3 select:focus,.rpick select:focus{outline:2px solid var(--accent); outline-offset:-1px}
.rpick{grid-template-columns:176px minmax(0,1fr) 104px 26px}
.tcItem{border-bottom:1px solid var(--line); padding:10px 4px; display:grid; gap:8px}
.card[data-sec="tarjeta"] .list .tcItem:last-child{border-bottom:0}
.tcItem .l1{display:flex; align-items:center; gap:8px}
.tcItem .l1 input[type="text"]{flex:1; min-width:0}
.tcItem.blank .x{visibility:hidden}
.tcItem .l2{display:flex; flex-wrap:wrap; gap:10px 14px}
.tcField{display:flex; flex-direction:column; gap:3px; min-width:92px}
.tcField label{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted)}
.tcField input,.tcField select{border:1px solid var(--line); background:var(--field); color:inherit; font:inherit; font-size:13px; padding:6px 8px; border-radius:8px; width:100%}
.tcField input:focus,.tcField select:focus{outline:2px solid var(--accent); outline-offset:-1px}
.amt-ro{font-variant-numeric:tabular-nums; font-weight:700; padding:6px 0; color:var(--ink)}
.tcRO{background:var(--soft); border-radius:10px; padding:8px 10px; margin-bottom:2px; border-bottom:0}
.tcRO .l1{justify-content:space-between; gap:8px}
.tcRO .tag{font-size:10px; flex:0 0 auto}
.tcRO .amt{font-weight:700; font-variant-numeric:tabular-nums; margin-left:auto}
.card[data-sec="fondo"] .head{background:var(--gold); color:var(--gold-ink)}
.card[data-sec="fondo"] > header h2{color:var(--gold-ink)}
.card[data-sec="retiro"] .head{background:var(--ve-blue)}
.card[data-sec="retiro"] > header h2{color:var(--ve-blue)}
.pay{
  width:28px; height:28px; border-radius:50%; padding:0; line-height:1; font-size:14px; font-weight:800;
  border:2px solid var(--neg); color:var(--neg); background:transparent; display:flex; align-items:center; justify-content:center;
  margin:0 auto;
}
.pay:hover{opacity:.85}
.pay.paid{border-color:var(--pos); color:#fff; background:var(--pos)}
.c-p{display:flex; align-items:center; justify-content:center}
.pie-wrap{display:flex; gap:20px; align-items:center; flex-wrap:wrap; margin-top:8px}
.pie-svg{width:180px; height:180px; flex:0 0 auto}
.pie-svg svg{width:100%; height:100%; display:block}
.pie-legend{flex:1; min-width:220px; display:grid; gap:4px}
.pie-row{display:grid; grid-template-columns:12px 1fr auto auto; gap:8px; align-items:center; font-size:12.5px; padding:3px 0}
.pie-dot{width:11px; height:11px; border-radius:3px}
.pie-label{color:var(--ink)}
.pie-amt{font-variant-numeric:tabular-nums; color:var(--muted)}
.pie-pct{font-variant-numeric:tabular-nums; font-weight:600; min-width:48px; text-align:right}
.cell-c{text-align:right; font-variant-numeric:tabular-nums; color:var(--muted); padding-right:6px}
.chk{display:flex; align-items:center; justify-content:center; gap:4px; font-size:11px; color:var(--muted)}
.chk input{width:17px; height:17px; accent-color:var(--accent)}
.chk span{display:none}
.x{border:0; background:transparent; color:var(--muted); width:24px; height:24px; border-radius:6px; line-height:1; font-size:16px; padding:0}
.x:hover{background:var(--chip); color:var(--danger)}
.row.blank .x{visibility:hidden}
.row.auto{background:var(--soft); border-radius:8px; border-bottom:0; margin:2px 0; padding:8px 8px}
.row.auto .n{display:flex; align-items:center; gap:8px; min-width:0}
.row.auto .n > span:first-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row.auto .amt{text-align:right; font-variant-numeric:tabular-nums; font-weight:600}
.tag{font-size:10px; text-transform:uppercase; letter-spacing:.05em; background:var(--card); color:var(--muted); border-radius:99px; padding:2px 7px; white-space:nowrap}
.add{margin:8px 4px 0; border:1px dashed var(--line); background:transparent; color:var(--accent); border-radius:10px; padding:8px 12px; font-weight:600; width:calc(100% - 8px)}
.add:hover{border-color:var(--accent); background:var(--soft)}

table.tbl{width:100%; border-collapse:collapse; margin-top:8px}
.tbl th,.tbl td{padding:9px 8px; text-align:right; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted)}
.tbl tr.strong td{font-weight:700; background:var(--soft)}
.tbl-wrap{overflow-x:auto}
.two{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; align-items:start}
.bars{display:grid; gap:14px; margin-top:12px}
.bar-grp b{display:block; margin-bottom:6px; font-size:13px}
.bar{display:grid; grid-template-columns:78px 1fr 96px; gap:8px; align-items:center; margin:4px 0; font-size:12px; color:var(--muted)}
.bar .track{height:12px; background:var(--chip); border-radius:99px; overflow:hidden}
.bar .fill{height:100%; border-radius:99px; width:0; transition:width .25s}
.bar .fill.i{background:var(--inc)} .bar .fill.e{background:var(--exp)}
.bar em{font-style:normal; text-align:right; color:var(--ink); font-variant-numeric:tabular-nums}
.tools{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px}
.small{font-size:12px; color:var(--muted)}
.empty{background:var(--card); border-radius:16px; padding:28px; box-shadow:var(--shadow); max-width:520px; margin:24px auto; display:grid; gap:12px; text-align:center}
.empty h2{font-size:18px; color:var(--brand)}
.empty .tools{justify-content:center}

.overlay{position:fixed; inset:0; background:rgba(10,15,30,.5); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50}
.modal{background:var(--card); color:var(--ink); border-radius:16px; padding:20px; width:min(440px,100%); box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h3{font-size:17px; margin-bottom:12px; color:var(--brand)}
.modal label{display:flex; gap:8px; align-items:center; margin:10px 0}
.modal .actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px}
.modal ul{margin:8px 0 0; padding-left:18px}
#toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom,0px));
  background:#1b2333; color:#fff; padding:10px 16px; border-radius:10px; font-size:13px; z-index:60;
  opacity:0; pointer-events:none; transition:opacity .2s; max-width:calc(100% - 32px);
}
#toast.show{opacity:1}

@media (max-width: 900px){
  .qgrid{grid-template-columns:minmax(0,1fr); grid-template-areas:"ing" "egr" "pla" "ant"}
}
@media (max-width: 640px){
  main{padding:12px 10px 40px}
  .top{padding:10px 10px 0}
  .tab{padding:9px 10px; flex:1}
  .kpi b{font-size:19px}
  .r2{grid-template-columns:minmax(0,1fr) 112px 24px}
  .head.r5{display:none}
  .r5{
    grid-template-columns:minmax(0,1.4fr) 58px minmax(0,1fr) 62px;
    grid-template-areas:"n n n x" "m d c r";
    padding:6px 4px; row-gap:2px;
  }
  .r5 .c-n{grid-area:n} .r5 .c-m{grid-area:m} .r5 .c-d{grid-area:d}
  .r5 .c-c{grid-area:c} .r5 .c-r{grid-area:r} .r5 .c-x{grid-area:x}
  .chk span{display:inline}
  .bar{grid-template-columns:64px 1fr 88px}
  .head.r3{display:none}
  .r3{
    grid-template-columns:minmax(0,1fr) 82px 36px 24px;
    grid-template-areas:"n n n x" "c m p x";
    padding:6px 4px; row-gap:4px;
  }
  .r3 .c-n{grid-area:n} .r3 .c-c{grid-area:c} .r3 .c-m{grid-area:m} .r3 .c-p{grid-area:p} .r3 .c-x{grid-area:x}
  .head.rpick{display:none}
  .rpick{
    grid-template-columns:minmax(0,1fr) 92px 24px;
    grid-template-areas:"s s x" "n m x";
    padding:6px 4px; row-gap:4px;
  }
  .rpick .c-s{grid-area:s} .rpick .c-n{grid-area:n} .rpick .c-m{grid-area:m} .rpick .c-x{grid-area:x}
  .tcField{min-width:80px}
  .pie-svg{width:140px; height:140px}
}
</style>
</head>
<body>
<div class="flagbar"></div>

<header class="top">
  <div class="top-row">
    <div class="brand">
      <h1>Casa Viera Ollarves</h1>
      <p>Libro de ingresos y egresos</p>
    </div>
    <div class="controls" id="controls" hidden>
      <select id="mes" aria-label="Mes"></select>
      <button class="btn" id="nuevoMes" type="button">＋ Nuevo mes</button>
      <button class="btn primary" id="installBtn" type="button" hidden>⬇ Instalar app</button>
      <span class="pill" id="status" role="status"></span>
      <button class="btn" id="salir" type="button">Salir</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" hidden>
    <button class="tab" role="tab" data-tab="resumen" type="button">Resumen</button>
    <button class="tab" role="tab" data-tab="q1" type="button">1ra quincena</button>
    <button class="tab" role="tab" data-tab="q2" type="button">2da quincena</button>
  </nav>
</header>

<div id="loading" class="center" hidden><p id="loadingMsg">Cargando…</p><p class="err" id="loadingErr"></p></div>

<div id="setup" class="center" hidden>
  <div class="setup">
    <h2>Falta configurar Firebase</h2>
    <p style="margin-top:8px">Abrí el archivo <code>firebase-config.js</code> y pegá los datos de tu proyecto (paso 4 del LEEME). Después subilo de nuevo a GitHub.</p>
  </div>
</div>

<div id="login" class="center" hidden>
  <form class="loginbox" id="loginForm">
    <h2>Ingresar</h2>
    <label>Correo <input type="email" id="lEmail" autocomplete="username" required></label>
    <label>Clave <input type="password" id="lPass" autocomplete="current-password" required></label>
    <button class="btn primary" id="lBtn" type="submit">Entrar</button>
    <p class="err" id="lErr" role="alert"></p>
    <button class="link" id="lReset" type="button">Olvidé mi clave</button>
  </form>
</div>

<main id="main" hidden></main>
<div id="toast" role="status"></div>
<div id="modal-root"></div>
<input type="file" id="fileImp" accept=".json,application/json" hidden>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script type="module">
const FB='https://www.gstatic.com/firebasejs/10.14.1/';

/* ---------- Constantes ---------- */
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const SECS=['ingresos','plataformas','egresos','anticipados','fondo','retiro','tarjeta'];
const CUOTAS_OPC=[1,2,3,6,9,12];
const QS=['q1','q2'];
const QNAME={q1:'1ra quincena',q2:'2da quincena'};
const MIN={ingresos:12,plataformas:14,egresos:22,anticipados:18,fondo:6,retiro:6,tarjeta:10};
const MES_RE=/^\d{4}-(0[1-9]|1[0-2])$/;
const CATS=['Alimentación','Servicios','Transporte','Regalos','Deudas','Alquiler','Salud','Hijos','Entretenimiento','Otros'];
const PIE_PAL=['#FFCC00','#00247D','#CF142B','#2e7d32','#8e24aa','#ef6c00','#00897b','#5d4037','#546e7a','#ad1457','#1565c0','#757575'];

/* ---------- Utilidades ---------- */
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const $=(s,r)=>(r||document).querySelector(s);
const el=(tag,cls)=>{const e=document.createElement(tag); if(cls) e.className=cls; return e;};
const nf=new Intl.NumberFormat('es-AR',{maximumFractionDigits:2});
const cf=new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});
const fmt=v=>v==null?'':nf.format(v);
const num=v=>(typeof v==='number'&&isFinite(v))?v:0;
const monthLabel=id=>{const p=id.split('-'); return MESES[Number(p[1])-1]+' '+p[0];};
function parseMoney(s){
  s=String(s).replace(/[\s$]/g,'');
  if(!s) return null;
  if(s.indexOf(',')>=0) s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  const n=Number(s);
  return isFinite(n)?n:NaN;
}
let toastTimer=null;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),3200);
}
function setView(v){

/* ---------- Modelo de datos ---------- */
const blank=sec=>{
  if(sec==='plataformas') return {id:uid(),n:'',m:null,d:null,r:true};
  if(sec==='egresos'||sec==='anticipados') return {id:uid(),n:'',m:null,cat:'',pagado:false};
  if(sec==='tarjeta') return {id:uid(),n:'',m:null,cuotas:1,valorCuota:null,inicio:cur||null};
  return {id:uid(),n:'',m:null};
};
const isBlank=(r,sec)=>!String(r.n||'').trim() && r.m==null && (sec!=='plataformas' || r.d==null);
function normRow(r,sec){
  const o={id:String(r.id||uid()), n:String(r.n==null?'':r.n), m:(typeof r.m==='number'&&isFinite(r.m))?r.m:null};
  if(sec==='plataformas'){ o.d=(typeof r.d==='number'&&r.d>0)?r.d:null; o.r=r.r!==false; }
  if(sec==='egresos'||sec==='anticipados'){ o.cat=(typeof r.cat==='string'&&CATS.includes(r.cat))?r.cat:''; o.pagado=r.pagado===true; }
  if(sec==='tarjeta'){
    o.cuotas=(typeof r.cuotas==='number'&&CUOTAS_OPC.includes(r.cuotas))?r.cuotas:1;
    o.valorCuota=(typeof r.valorCuota==='number'&&isFinite(r.valorCuota))?r.valorCuota:null;
    o.inicio=(typeof r.inicio==='string'&&MES_RE.test(r.inicio))?r.inicio:null;
  }
  return o;
}
const autoPlat=qd=>qd.plataformas.filter(p=>p.r && String(p.n).trim());
const hasMama=qd=>qd.plataformas.some(p=>p.d>0);
function padSec(qd,sec){
  const arr=qd[sec];
  let need=MIN[sec];
  if(sec==='egresos') need-=autoPlat(qd).length;
  if(sec==='ingresos' && hasMama(qd)) need-=1;
  while(arr.length<need) arr.push(blank(sec));
  if(!arr.length || !isBlank(arr[arr.length-1],sec)) arr.push(blank(sec));
}
function categoryTotals(qd){
  const totals={};
  const add=(cat,amt)=>{ if(!(amt>0)) return; const k=cat||'Sin categoría'; totals[k]=(totals[k]||0)+amt; };
  autoPlat(qd).forEach(p=>add('Plataformas y servicios',num(p.m)));
  qd.egresos.forEach(r=>{ if(!isBlank(r,'egresos')) add(r.cat,num(r.m)); });
  qd.anticipados.forEach(r=>{ if(!isBlank(r,'anticipados')) add(r.cat,num(r.m)); });
  return totals;
}
function monthCategoryTotals(md){
  const out={}; const a=categoryTotals(md.q1), b=categoryTotals(md.q2);
  [a,b].forEach(t=>Object.keys(t).forEach(k=>{ out[k]=(out[k]||0)+t[k]; }));
  return out;
}
function buildPieSVG(totals){
  const entries=Object.entries(totals).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const total=entries.reduce((s,[,v])=>s+v,0);
  const CX=100,CY=100,R=92; let ang=-Math.PI/2, paths='';
  entries.forEach(([k,v],i)=>{
    const frac=v/total, a2=ang+frac*Math.PI*2;
    const x1=CX+R*Math.cos(ang), y1=CY+R*Math.sin(ang);
    const x2=CX+R*Math.cos(a2), y2=CY+R*Math.sin(a2);
    const large=(a2-ang)>Math.PI?1:0;
    paths+='<path d="M'+CX+' '+CY+' L'+x1.toFixed(2)+' '+y1.toFixed(2)+' A'+R+' '+R+' 0 '+large+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+' Z" fill="'+PIE_PAL[i%PIE_PAL.length]+'"></path>';
    ang=a2;
  });
  if(!entries.length) paths='<circle cx="100" cy="100" r="92" fill="var(--chip)"></circle>';
  const svg='<svg viewBox="0 0 200 200" role="img" aria-label="Egresos por categoría">'+paths+'</svg>';
  const legend=entries.map(([k,v],i)=>({color:PIE_PAL[i%PIE_PAL.length],label:k,amt:v,pct:total>0?v/total:0}));
  return {svg,legend,total};
}
function hydrate(src){
  const md={v:1};
  QS.forEach(q=>{
    md[q]={};
    SECS.forEach(sec=>{
      const a=(src&&src[q]&&Array.isArray(src[q][sec]))?src[q][sec]:[];
      md[q][sec]=a.map(r=>normRow(r||{},sec));
    });
    SECS.forEach(sec=>padSec(md[q],sec));
  });
  return md;
}
function serialize(md){
  const o={v:1};
  QS.forEach(q=>{
    o[q]={};
    SECS.forEach(sec=>{ o[q][sec]=md[q][sec].filter(r=>!isBlank(r,sec)).map(r=>normRow(r,sec)); });
  });
  return o;
}
function monthDiff(aId,bId){
  const a=aId.split('-').map(Number), b=bId.split('-').map(Number);
  return (b[0]-a[0])*12+(b[1]-a[1]);
}
function activeCuotasFor(monthId,q){
  const out=[];
  Object.keys(months).forEach(mId=>{
    const qd=months[mId] && months[mId][q]; if(!qd) return;
    qd.tarjeta.forEach(row=>{
      if(isBlank(row,'tarjeta')) return;
      const n=row.cuotas||1;
      const start=(row.inicio&&MES_RE.test(row.inicio))?row.inicio:mId;
      const idx=monthDiff(start,monthId);
      if(idx<0||idx>=n) return;
      out.push({storageMonth:mId,row,cuotaNum:idx+1,totalCuotas:n,amount:num(row.valorCuota),isOrigin:(mId===monthId)});
    });
  });
  return out;
}
const monthTarjetaTotal=(monthId,q)=>activeCuotasFor(monthId,q).reduce((s,it)=>s+it.amount,0);
function calc(qd){
  const cu=p=>(p.d>0&&p.m!=null)?p.m/p.d:0;
  const mama=qd.plataformas.reduce((s,p)=>s+cu(p),0);
  const ingManual=qd.ingresos.reduce((s,r)=>s+num(r.m),0);
  const ingresos=ingManual+(hasMama(qd)?mama:0);
  const egresos=autoPlat(qd).reduce((s,p)=>s+num(p.m),0)+qd.egresos.reduce((s,r)=>s+num(r.m),0);
  const antic=qd.anticipados.reduce((s,r)=>s+num(r.m),0);
  const platTotal=qd.plataformas.reduce((s,p)=>s+num(p.m),0);
  const fondo=qd.fondo.reduce((s,r)=>s+num(r.m),0);
  const retiro=qd.retiro.reduce((s,r)=>s+num(r.m),0);
  const egresosTotales=egresos+antic;
  return {mama,ingresos,egresos,antic,egresosTotales,fondo,retiro,balance:ingresos-egresosTotales-fondo,platTotal,pct:ingresos>0?egresosTotales/ingresos:0};
}

/* ---------- Estado ---------- */
let months={}, cur=null, tab='resumen';
let ready=false, inflight=null, saving=false, saveTimer=null, retryTimer=null, pendingRender=false;
const dirty=new Set();
let fbApp=null, auth=null, db=null, FS=null, AU=null, unsub=null, me=null, loadTimer=null;

/* ---------- Guardado ---------- */
function setStatus(kind,err){
  const s=$('#status'); s.classList.remove('err');
  const map={saved:'✓ Guardado',saving:'Guardando…',editing:'Editando…',ready:'Listo'};
  if(kind==='error'){
    s.classList.add('err');
    s.textContent=(err&&err.code==='permission-denied')?'⚠ Sin permiso para guardar':'⚠ No se pudo guardar';
  } else s.textContent=map[kind]||'';
}
function markDirty(id){
  if(!ready) return;
  dirty.add(id||cur); setStatus('editing');
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(saving||!db) return;
  saving=true;
  try{
    while(dirty.size){
      const id=dirty.values().next().value; dirty.delete(id);
      if(!months[id]) continue;
      inflight=id; setStatus('saving');
      try{ await FS.setDoc(FS.doc(db,'libro',id),serialize(months[id])); }
      catch(e){ dirty.add(id); throw e; }
      finally{ inflight=null; }
    }
    setStatus('saved');
  }catch(e){
    setStatus('error',e);
    clearTimeout(retryTimer); retryTimer=setTimeout(()=>{retryTimer=null; flush();},6000);
  }finally{
    saving=false;
    if(dirty.size && !retryTimer){ clearTimeout(saveTimer); saveTimer=setTimeout(flush,400); }
  }
}
function onRemote(map,definitive){
  let changed=false;
  Object.keys(map).forEach(id=>{
    if(dirty.has(id)||inflight===id) return;
    const inc=hydrate(map[id]);
    if(!months[id] || JSON.stringify(serialize(months[id]))!==JSON.stringify(serialize(inc))){ months[id]=inc; changed=true; }
  });
  Object.keys(months).forEach(id=>{
    if(!map[id] && !dirty.has(id) && inflight!==id){ delete months[id]; changed=true; }
  });
  if(!months[cur]){
    const all=Object.keys(months).sort();
    cur=all.length?all[all.length-1]:null; changed=true;
  }
  if(!ready && definitive){
    ready=true; clearTimeout(loadTimer); setView('app'); changed=true; setStatus('ready');
    if(dirty.size) flush();
  }
  if(changed && ready) safeRender();
}
function safeRender(){
  const a=document.activeElement;
  if(a && a.matches && a.matches('input[type="text"]')){ pendingRender=true; return; }
  render();
}
document.addEventListener('focusout',()=>{
  if(!pendingRender) return;
  setTimeout(()=>{
    const a=document.activeElement;
    if(a && a.matches && a.matches('input[type="text"]')) return;
    pendingRender=false; render();
  },80);
});

function startData(){
  ready=false; months={}; cur=null; dirty.clear();
  setView('loading'); $('#loadingMsg').textContent='Cargando tus datos…'; $('#loadingErr').textContent='';
  clearTimeout(loadTimer);
  loadTimer=setTimeout(()=>{ if(!ready) $('#loadingMsg').textContent='Sigue cargando… revisá tu conexión a internet.'; },8000);
  unsub=FS.onSnapshot(FS.collection(db,'libro'),snap=>{
    const map={};
    snap.docs.forEach(d=>{ map[d.id]=JSON.parse(JSON.stringify(d.data())); });
    onRemote(map,!snap.metadata.fromCache);
  },err=>{
    if(!ready){
      $('#loadingMsg').textContent='No se pudieron cargar los datos.';
      $('#loadingErr').textContent=(err&&err.code==='permission-denied')
        ? 'Tu usuario no tiene permiso. Agregá este ID a las reglas de Firestore: '+(me?me.uid:'')
        : 'Error: '+((err&&err.code)||'desconocido');
    } else setStatus('error',err);
  });
}
function stopData(){
  if(unsub){ try{unsub();}catch(e){} unsub=null; }
  clearTimeout(loadTimer); clearTimeout(saveTimer); clearTimeout(retryTimer); retryTimer=null;
  months={}; cur=null; ready=false; dirty.clear(); $('#main').replaceChildren(); closeModal();
}

function refreshComputed(){
  const md=months[cur]; if(!md) return;
  const C={q1:calc(md.q1),q2:calc(md.q2)};
  C.q1.tarjeta=monthTarjetaTotal(cur,'q1'); C.q2.tarjeta=monthTarjetaTotal(cur,'q2');
  const mes={ingresos:C.q1.ingresos+C.q2.ingresos, egresos:C.q1.egresos+C.q2.egresos,
             antic:C.q1.antic+C.q2.antic, egresosTotales:C.q1.egresosTotales+C.q2.egresosTotales,
             fondo:C.q1.fondo+C.q2.fondo, retiro:C.q1.retiro+C.q2.retiro, tarjeta:C.q1.tarjeta+C.q2.tarjeta,
             mama:C.q1.mama+C.q2.mama, platTotal:0};
  mes.balance=mes.ingresos-mes.egresosTotales-mes.fondo;
  mes.pct=mes.ingresos>0?mes.egresosTotales/mes.ingresos:0;
  C.mes=mes;
  document.querySelectorAll('[data-k]').forEach(e=>{
    const p=e.dataset.k.split('.'); const v=C[p[0]]&&C[p[0]][p[1]]; if(v===undefined) return;
    e.textContent=p[1]==='pct'?(Math.round(v*1000)/10).toString().replace('.',',')+' %':cf.format(v);
    if(p[1]==='balance'){ e.classList.toggle('neg',v<0); e.classList.toggle('pos',v>=0); }
  });
  QS.forEach(q=>{
    md[q].plataformas.forEach(p=>{
      const c=document.querySelector('[data-cu="'+p.id+'"]');
      if(c) c.textContent=(p.d>0&&p.m!=null)?cf.format(p.m/p.d):'';
      const a=document.querySelector('[data-aut="'+p.id+'"]');
      if(a) a.textContent=cf.format(num(p.m));
    });
  });
  const mx=Math.max(C.q1.ingresos,C.q1.egresosTotales,C.q2.ingresos,C.q2.egresosTotales,1);
  document.querySelectorAll('[data-bar]').forEach(b=>{
    const p=b.dataset.bar.split('.'); b.style.width=Math.max(0,Math.min(100,C[p[0]][p[1]]/mx*100))+'%';
  });
  document.querySelectorAll('[data-barv]').forEach(b=>{
    const p=b.dataset.barv.split('.'); b.textContent=cf.format(C[p[0]][p[1]]);
  });
  renderPie(md);
}
function renderPie(md){
  const host=document.getElementById('pieWrap'); if(!host) return;
  const totals=monthCategoryTotals(md);

  if(tc>0) totals['Tarjeta de crédito']=(totals['Tarjeta de crédito']||0)+tc;
  const {svg,legend,total}=buildPieSVG(totals);

    '<span class="pie-label">'+e.label+'</span>'+

  ).join('');

function card(q,sec,title,totalKey,hint){
  const c=el('section','card'); c.dataset.sec=sec;
  const h=el('header'); const t=el('h2'); t.textContent=title;
  const tot=el('span','tot'); tot.setAttribute('data-k',q+'.'+totalKey); h.append(t,tot); c.append(h);
  if(hint){ const p=el('p','hint'); p.innerHTML=hint.replace('{q}',q); c.append(p); }
  const isCat=(sec==='egresos'||sec==='anticipados');
  const isRetiro=sec==='retiro';
  const isTarjeta=sec==='tarjeta';
  if(!isTarjeta){
    const head=el('div','head '+(sec==='plataformas'?'r5':(isCat?'r3':(isRetiro?'rpick':'r2'))));
    const labels=sec==='plataformas'?['Plataforma','Monto','Entre','C/U','En egr.']:(isCat?[sec==='egresos'?'Gasto':'Concepto','Categoría','Monto']:(isRetiro?['Elegir de Egresos variables','Concepto','Monto']:['Concepto','Monto']));
    labels.forEach(l=>{const s=el('span'); s.textContent=l; head.append(s);});
    if(sec==='plataformas'){ head.children[2].title='Entre cuántos se divide (3 = Jorge, Josse y Mamá)'; head.children[4].title='Reflejar en Egresos'; }
    if(isCat){ const sp=el('span'); sp.textContent='Pagado'; head.append(sp); }
    head.append(el('span'));
    c.append(head);
  }
  const list=el('div','list'); list.id=q+'-'+sec; c.append(list);
  const add=el('button','add'); add.type='button'; add.textContent='＋ Agregar línea';
  add.addEventListener('click',()=>addLine(q,sec)); c.append(add);
  return c;
}

function exportBackup(){
  const all={}; Object.keys(months).forEach(id=>{all[id]=serialize(months[id]);});
  const blob=new Blob([JSON.stringify(all,null,2)],{type:'application/json'});
  const a=document.createElement('a'); const d=new Date();
  a.href=URL.createObjectURL(blob);
  a.download='respaldo-casa-viera-ollarves-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.json';
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast('Respaldo descargado');
}
function downloadBlob(blob,filename){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}

async function captureAndDeliver(innerHTML,width,filenameBase,format){
  if(typeof html2canvas==='undefined' || (format==='pdf' && !(window.jspdf&&window.jspdf.jsPDF))){
    toast('No se pudo cargar la herramienta de exportación. Revisá tu conexión a internet.'); return;
  }
  toast('Generando…');
  const wrap=document.createElement('div');
  wrap.style.cssText='position:fixed; left:-9999px; top:0; width:'+width+'px;';
  wrap.innerHTML=innerHTML;
  document.body.append(wrap);
  try{
    const canvas=await html2canvas(wrap,{scale:2,backgroundColor:'#ffffff'});
    if(format==='jpg'){
      canvas.toBlob(blob=>{ if(blob) downloadBlob(blob,filenameBase+'.jpg'); else toast('No se pudo generar la imagen'); },'image/jpeg',0.92);
    } else {
      const {jsPDF}=window.jspdf;
      const img=canvas.toDataURL('image/jpeg',0.95);
      const pdf=new jsPDF({orientation:canvas.width>=canvas.height?'landscape':'portrait',unit:'px',format:[canvas.width,canvas.height]});
      pdf.addImage(img,'JPEG',0,0,canvas.width,canvas.height);
      pdf.save(filenameBase+'.pdf');
    }
    toast('Listo');
  }catch(e){ toast('No se pudo generar el archivo'); }
  finally{ wrap.remove(); }
}
function exportMama(){
  const md=months[cur]; if(!md) return;
  captureAndDeliver(buildMamaHTML(md),680,'resumen-mama-'+cur,'jpg');
}

function importFile(file){
  const rd=new FileReader();
  rd.onerror=()=>toast('No se pudo leer el archivo');
  rd.onload=()=>{
    let obj; try{ obj=JSON.parse(String(rd.result)); }catch(e){ toast('El archivo no es un respaldo válido'); return; }
    const ids=(obj&&typeof obj==='object')?Object.keys(obj).filter(k=>MES_RE.test(k)&&obj[k]&&typeof obj[k]==='object'):[];
    if(!ids.length){ toast('No encontré meses en ese archivo'); return; }
    const clash=ids.filter(id=>months[id]);
    const apply=()=>{
      cur=ids.slice().sort()[ids.length-1];
      ids.forEach(id=>{ months[id]=hydrate(obj[id]); dirty.add(id); });
      tab='resumen'; render(); setStatus('editing'); flush();
      toast('Importados '+ids.length+(ids.length===1?' mes':' meses'));
    };
    if(!clash.length){ apply(); return; }
    const body=el('div'); const p=el('p'); p.textContent='Estos meses ya existen y se van a reemplazar:'; const ul=el('ul');
    clash.sort().forEach(id=>{const li=el('li'); li.textContent=monthLabel(id); ul.append(li);});
    body.append(p,ul);
    modal('¿Reemplazar meses?',body,[{label:'Cancelar'},{label:'Reemplazar',cls:'primary',onClick:()=>{apply();}}]);
  };
  rd.readAsText(file);
}
$('#fileImp').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value='';
  if(f&&ready) importFile(f);
});

/* ---------- Ventanas ---------- */
function closeModal(){ $('#modal-root').replaceChildren(); document.removeEventListener('keydown',escClose); }
function escClose(e){ if(e.key==='Escape') closeModal(); }
function modal(title,body,actions){
  const root=$('#modal-root'); root.replaceChildren();
  const ov=el('div','overlay'); const box=el('div','modal'); box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true');
  const h=el('h3'); h.textContent=title; box.append(h,body);
  const bar=el('div','actions');
  actions.forEach(a=>{
    const b=el('button','btn'+(a.cls?' '+a.cls:'')); b.type='button'; b.textContent=a.label;
    b.addEventListener('click',()=>{ if(a.onClick && a.onClick()===false) return; closeModal(); });
    bar.append(b);
  });
  box.append(bar); ov.append(box);
  ov.addEventListener('click',e=>{ if(e.target===ov) closeModal(); });
  root.append(ov); document.addEventListener('keydown',escClose);
}
function currentMonthId(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function nextMonthId(){
  const ids=Object.keys(months).sort(); if(!ids.length) return currentMonthId();
  const last=ids[ids.length-1];
  let y=Number(last.slice(0,4)), m=Number(last.slice(5,7))+1; if(m>12){m=1;y++;}
  return y+'-'+String(m).padStart(2,'0');
}
const cloneRows=(rows,sec)=>rows.filter(r=>!isBlank(r,sec)).map(r=>{const o=normRow(r,sec); o.id=uid(); return o;});
function createMonth(id,opts){
  if(months[id]){ cur=id; tab='resumen'; render(); toast('Ese mes ya existía: te lo muestro'); return; }
  const src=(opts&&months[cur])?months[cur]:null; const md={v:1};
  cur=id;
  QS.forEach(q=>{
    md[q]={};
    SECS.forEach(sec=>{
      const keep=src&&((sec==='plataformas'&&opts.plat)||(sec==='ingresos'&&opts.ing));
      md[q][sec]=keep?cloneRows(src[q][sec],sec):[];
    });
    SECS.forEach(sec=>padSec(md[q],sec));
  });
  months[id]=md; tab='resumen'; dirty.add(id); render(); flush();
}
function newMonthDialog(){
  const body=el('div');
  const l1=el('label'); l1.append('Mes: ');
  const inp=el('input'); inp.type='month'; inp.value=nextMonthId(); inp.className='txt'; inp.setAttribute('aria-label','Mes nuevo'); l1.append(inp);
  const l2=el('label'); const c1=el('input'); c1.type='checkbox'; c1.checked=true; l2.append(c1,'Copiar plataformas y reparto');
  const l3=el('label'); const c2=el('input'); c2.type='checkbox'; c2.checked=true; l3.append(c2,'Copiar ingresos (después cambiás los montos)');
  const note=el('p','small'); note.textContent='Los egresos y gastos anticipados arrancan vacíos. Se copia desde '+monthLabel(cur)+'.';
  body.append(l1,l2,l3,note);
  modal('Nuevo mes',body,[
    {label:'Cancelar'},
    {label:'Crear mes',cls:'primary',onClick:()=>{
      const id=inp.value.trim();
      if(!MES_RE.test(id)){ toast('Escribí el mes como AAAA-MM'); return false; }
      createMonth(id,{plat:c1.checked,ing:c2.checked});
    }}
  ]);
}
function askDeleteMonth(){
  if(Object.keys(months).length<2){ toast('No se puede eliminar el único mes'); return; }
  const id=cur;
  const p=el('p'); p.textContent='Se borran las dos quincenas de '+monthLabel(id)+'. Esto no se puede deshacer.';
  modal('¿Eliminar '+monthLabel(id)+'?',p,[
    {label:'Cancelar'},
    {label:'Eliminar',cls:'danger solid',onClick:async()=>{
      dirty.delete(id);
      try{ await FS.deleteDoc(FS.doc(db,'libro',id)); }catch(e){ toast('No se pudo eliminar'); return; }
      delete months[id];
      const all=Object.keys(months).sort(); cur=all[all.length-1]; render(); toast('Mes eliminado');
    }}
  ]);
}

/* ---------- Eventos ---------- */
$('#mes').addEventListener('change',e=>{ cur=e.target.value; render(); });
$('#nuevoMes').addEventListener('click',newMonthDialog);
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{ tab=t.dataset.tab; showTab(); window.scrollTo(0,0); }));
$('#salir').addEventListener('click',()=>{ if(auth) AU.signOut(auth); });

/* ---------- Instalar como app (Android/Windows) ---------- */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredInstall=e; $('#installBtn').hidden=false;
});
$('#installBtn').addEventListener('click',async()=>{
  if(!deferredInstall) return;
  $('#installBtn').hidden=true;
  deferredInstall.prompt();
  try{ await deferredInstall.userChoice; }catch(e){}
  deferredInstall=null;
});
window.addEventListener('appinstalled',()=>{ $('#installBtn').hidden=true; deferredInstall=null; toast('Instalada. Ya la tenés en tu equipo.'); });
if(window.matchMedia('(display-mode: standalone)').matches || navigator.standalone){ $('#installBtn').hidden=true; }
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('service-worker.js').catch(()=>{}); });
}

function loginError(e){
  const c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-email|missing-password/.test(c)) return 'Correo o clave incorrectos.';
  if(c==='auth/too-many-requests') return 'Demasiados intentos. Esperá unos minutos y probá de nuevo.';
  if(c==='auth/network-request-failed') return 'Sin conexión a internet.';
  if(c==='auth/unauthorized-domain') return 'Este dominio no está autorizado en Firebase (ver LEEME).';
  return 'No se pudo ingresar ('+(c||'error')+').';
}
$('#loginForm').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const btn=$('#lBtn'); $('#lErr').textContent=''; btn.disabled=true;
  try{ await AU.signInWithEmailAndPassword(auth,$('#lEmail').value.trim(),$('#lPass').value); $('#lPass').value=''; }
  catch(e){ $('#lErr').textContent=loginError(e); }
  finally{ btn.disabled=false; }
});
$('#lReset').addEventListener('click',async()=>{
  const email=$('#lEmail').value.trim();
  if(!email){ $('#lErr').textContent='Escribí tu correo arriba y tocá de nuevo.'; return; }
  try{ await AU.sendPasswordResetEmail(auth,email); $('#lErr').textContent=''; toast('Si el correo existe, te llegó un mensaje para cambiar la clave'); }
  catch(e){ $('#lErr').textContent=loginError(e); }
});

/* ---------- Arranque ---------- */
async function boot(){
  setView('loading'); $('#loadingMsg').textContent='Cargando…';
  let cfg;
  try{ cfg=(await import('./firebase-config.js')).firebaseConfig; }catch(e){ cfg=null; }
  if(!cfg || !cfg.apiKey || /PEGAR/.test(cfg.apiKey+cfg.projectId)){ setView('setup'); return; }
  try{
    const [A,AUm,FSm]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-firestore.js')]);
    AU=AUm; FS=FSm;
    fbApp=A.initializeApp(cfg); auth=AU.getAuth(fbApp); db=FS.getFirestore(fbApp);
  }catch(e){
    $('#loadingMsg').textContent='No se pudo cargar Firebase. Revisá tu conexión a internet y recargá.'; return;
  }
  AU.onAuthStateChanged(auth,user=>{
    if(user){ me=user; startData(); }
    else { me=null; stopData(); setView('login'); }
  });
}
boot();
</script>
